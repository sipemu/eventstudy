<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none">
  <rect width="360" height="200" fill="#f8f9fa"/>
  <rect width="360" height="6" fill="#20c997"/>
  <text x="180" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#20c997" text-anchor="middle">Regulatory Shock Analysis</text>
  <!-- Axes -->
  <line x1="30" y1="155" x2="330" y2="155" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="30" y1="50" x2="30" y2="155" stroke="#adb5bd" stroke-width="1.5"/>
  <!-- Vertical dashed event line -->
  <line x1="180" y1="155" x2="180" y2="45" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="180" y="42" font-family="sans-serif" font-size="8" fill="#6c757d" text-anchor="middle">event</text>
  <!-- Peer-group line: flat/stable in grey -->
  <polyline points="40,95 90,92 135,94 180,95 215,90 255,96 300,92 325,94" stroke="#6c757d" stroke-width="2" fill="none"/>
  <text x="330" y="96" font-family="sans-serif" font-size="8" fill="#6c757d">peers</text>
  <!-- VW-group line: together, then crashes after event in teal -->
  <polyline points="40,93 90,90 135,92 180,93 210,120 245,140 285,146 325,148" stroke="#20c997" stroke-width="2.5" fill="none"/>
  <text x="330" y="150" font-family="sans-serif" font-size="9" font-weight="700" fill="#20c997">VW</text>
</svg>
