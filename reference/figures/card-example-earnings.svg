<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none">
  <rect width="360" height="200" fill="#f8f9fa"/>
  <rect width="360" height="6" fill="#20c997"/>
  <text x="180" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#20c997" text-anchor="middle">Earnings Surprise Analysis</text>
  <!-- Axes -->
  <line x1="30" y1="155" x2="330" y2="155" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="30" y1="55" x2="30" y2="155" stroke="#adb5bd" stroke-width="1.5"/>
  <!-- Bars with error whiskers -->
  <rect x="60" y="120" width="28" height="35" fill="#20c997" opacity="0.6"/>
  <line x1="74" y1="104" x2="74" y2="120" stroke="#20c997" stroke-width="2"/>
  <line x1="66" y1="104" x2="82" y2="104" stroke="#20c997" stroke-width="2"/>
  <rect x="110" y="98" width="28" height="57" fill="#20c997" opacity="0.6"/>
  <line x1="124" y1="80" x2="124" y2="98" stroke="#20c997" stroke-width="2"/>
  <line x1="116" y1="80" x2="132" y2="80" stroke="#20c997" stroke-width="2"/>
  <rect x="160" y="70" width="28" height="85" fill="#20c997" opacity="0.6"/>
  <line x1="174" y1="52" x2="174" y2="70" stroke="#20c997" stroke-width="2"/>
  <line x1="166" y1="52" x2="182" y2="52" stroke="#20c997" stroke-width="2"/>
  <rect x="210" y="110" width="28" height="45" fill="#20c997" opacity="0.6"/>
  <line x1="224" y1="93" x2="224" y2="110" stroke="#20c997" stroke-width="2"/>
  <line x1="216" y1="93" x2="232" y2="93" stroke="#20c997" stroke-width="2"/>
  <!-- Positive-surprise up-arrow near the tallest bar -->
  <line x1="174" y1="48" x2="174" y2="34" stroke="#198754" stroke-width="2.5"/>
  <polygon points="174,30 168,40 180,40" fill="#198754"/>
  <!-- Event marker line -->
  <line x1="264" y1="155" x2="264" y2="45" stroke="#20c997" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>
  <text x="264" y="42" font-family="sans-serif" font-size="8" fill="#20c997" text-anchor="middle">t0</text>
  <text x="185" y="170" font-family="sans-serif" font-size="8" fill="#6c757d" text-anchor="middle">Event window</text>
</svg>
