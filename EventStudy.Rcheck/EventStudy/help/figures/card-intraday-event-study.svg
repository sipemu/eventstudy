  <line x1="210" y1="80" x2="210" y2="120" stroke="#6f42c1" stroke-width="1"/>
  <rect x="205" y="85" width="10" height="14" fill="#6f42c1" opacity="0.7"/>
  <line x1="240" y1="88" x2="240" y2="118" stroke="#6f42c1" stroke-width="1"/>
  <rect x="235" y="92" width="10" height="12" fill="#6f42c1" opacity="0.6"/>
  <line x1="270" y1="95" x2="270" y2="118" stroke="#6f42c1" stroke-width="1"/>
  <rect x="265" y="98" width="10" height="10" fill="#6f42c1" opacity="0.5"/>
