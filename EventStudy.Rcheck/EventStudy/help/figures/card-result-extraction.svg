<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none">
  <rect width="360" height="200" fill="#f8f9fa"/>
  <rect width="360" height="6" fill="#0d6efd"/>
  <text x="180" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#0d6efd" text-anchor="middle">Result Extraction</text>
  <!-- Table header -->
  <rect x="40" y="50" width="200" height="22" rx="2" fill="#0d6efd"/>
  <text x="55" y="65" font-family="sans-serif" font-size="9" fill="#fff">event_id</text>
  <text x="115" y="65" font-family="sans-serif" font-size="9" fill="#fff">AR</text>
  <text x="155" y="65" font-family="sans-serif" font-size="9" fill="#fff">CAR</text>
  <text x="200" y="65" font-family="sans-serif" font-size="9" fill="#fff">p-value</text>
  <!-- Table rows -->
  <rect x="40" y="72" width="200" height="18" fill="#fff" stroke="#dee2e6"/>
  <text x="55" y="84" font-family="sans-serif" font-size="9" fill="#212529">EVT-01</text>
  <text x="115" y="84" font-family="sans-serif" font-size="9" fill="#212529">0.023</text>
  <text x="155" y="84" font-family="sans-serif" font-size="9" fill="#212529">0.041</text>
  <text x="200" y="84" font-family="sans-serif" font-size="9" fill="#212529">0.031</text>
  <rect x="40" y="90" width="200" height="18" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="55" y="102" font-family="sans-serif" font-size="9" fill="#212529">EVT-02</text>
  <text x="115" y="102" font-family="sans-serif" font-size="9" fill="#212529">-0.011</text>
  <text x="155" y="102" font-family="sans-serif" font-size="9" fill="#212529">0.012</text>
  <text x="200" y="102" font-family="sans-serif" font-size="9" fill="#212529">0.142</text>
  <rect x="40" y="108" width="200" height="18" fill="#fff" stroke="#dee2e6"/>
  <text x="55" y="120" font-family="sans-serif" font-size="9" fill="#212529">EVT-03</text>
  <text x="115" y="120" font-family="sans-serif" font-size="9" fill="#212529">0.047</text>
  <text x="155" y="120" font-family="sans-serif" font-size="9" fill="#212529">0.089</text>
  <text x="200" y="120" font-family="sans-serif" font-size="9" fill="#212529">0.008</text>
  <!-- Export arrow -->
  <line x1="250" y1="95" x2="310" y2="95" stroke="#0d6efd" stroke-width="2.5"/>
  <polygon points="310,90 320,95 310,100" fill="#0d6efd"/>
  <!-- Export icons (CSV/LaTeX) -->
  <text x="320" y="85" font-family="sans-serif" font-size="9" fill="#0d6efd">CSV</text>
  <text x="320" y="100" font-family="sans-serif" font-size="9" fill="#0d6efd">LaTeX</text>
  <text x="320" y="115" font-family="sans-serif" font-size="9" fill="#0d6efd">Excel</text>
</svg>
