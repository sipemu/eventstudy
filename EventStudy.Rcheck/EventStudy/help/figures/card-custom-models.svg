<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none">
  <rect width="360" height="200" fill="#f8f9fa"/>
  <rect width="360" height="6" fill="#198754"/>
  <text x="180" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#198754" text-anchor="middle">Custom Return Models</text>
  <!-- ModelBase box -->
  <rect x="110" y="55" width="140" height="70" rx="6" fill="#fff" stroke="#198754" stroke-width="2"/>
  <text x="180" y="78" font-family="sans-serif" font-size="10" fill="#198754" text-anchor="middle" font-weight="700">ModelBase</text>
  <text x="180" y="96" font-family="sans-serif" font-size="8.5" fill="#6c757d" text-anchor="middle">fit(data_tbl)</text>
  <text x="180" y="112" font-family="sans-serif" font-size="8.5" fill="#6c757d" text-anchor="middle">abnormal_returns()</text>
  <!-- Arrow down -->
  <line x1="180" y1="125" x2="180" y2="150" stroke="#198754" stroke-width="2"/>
  <polygon points="175,150 180,160 185,150" fill="#198754"/>
  <!-- Custom plugin box -->
  <rect x="130" y="155" width="100" height="32" rx="6" fill="#198754"/>
  <text x="180" y="175" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle">MyModel</text>
  <!-- Inheritance arrow left side -->
  <text x="55" y="95" font-family="sans-serif" font-size="8.5" fill="#6c757d" text-anchor="middle">inherit =</text>
  <line x1="80" y1="91" x2="110" y2="91" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>
