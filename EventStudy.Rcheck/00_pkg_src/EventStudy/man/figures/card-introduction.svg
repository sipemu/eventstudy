<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none">
  <!-- Background -->
  <rect width="360" height="200" fill="#f8f9fa"/>
  <!-- Accent bar -->
  <rect width="360" height="6" fill="#0d6efd"/>
  <!-- Label -->
  <text x="180" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#0d6efd" text-anchor="middle">Event Study</text>
  <!-- Timeline baseline -->
  <line x1="30" y1="130" x2="330" y2="130" stroke="#adb5bd" stroke-width="2"/>
  <!-- Event date marker -->
  <line x1="180" y1="110" x2="180" y2="150" stroke="#0d6efd" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="180" y="165" font-family="sans-serif" font-size="10" fill="#0d6efd" text-anchor="middle">t=0</text>
  <!-- Estimation window bracket -->
  <line x1="40" y1="125" x2="140" y2="125" stroke="#6c757d" stroke-width="1.5"/>
  <line x1="40" y1="120" x2="40" y2="130" stroke="#6c757d" stroke-width="1.5"/>
  <line x1="140" y1="120" x2="140" y2="130" stroke="#6c757d" stroke-width="1.5"/>
  <text x="90" y="118" font-family="sans-serif" font-size="9" fill="#6c757d" text-anchor="middle">estimation</text>
  <!-- Event window bracket -->
  <line x1="160" y1="125" x2="270" y2="125" stroke="#0d6efd" stroke-width="1.5"/>
  <line x1="160" y1="120" x2="160" y2="130" stroke="#0d6efd" stroke-width="1.5"/>
  <line x1="270" y1="120" x2="270" y2="130" stroke="#0d6efd" stroke-width="1.5"/>
  <text x="215" y="118" font-family="sans-serif" font-size="9" fill="#0d6efd" text-anchor="middle">event window</text>
  <!-- AR spike -->
  <polyline points="160,130 170,128 180,90 190,125 200,127 210,129 220,130" stroke="#0d6efd" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <!-- AR label -->
  <text x="185" y="85" font-family="sans-serif" font-size="10" fill="#0d6efd">AR</text>
</svg>
