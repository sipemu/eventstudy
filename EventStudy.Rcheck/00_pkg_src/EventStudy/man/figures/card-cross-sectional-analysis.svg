<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none">
  <rect width="360" height="200" fill="#f8f9fa"/>
  <rect width="360" height="6" fill="#dc3545"/>
  <text x="180" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#dc3545" text-anchor="middle">Cross-Sectional Analysis</text>
  <line x1="40" y1="155" x2="320" y2="155" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="40" y1="55" x2="40" y2="155" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="180" y="172" font-family="sans-serif" font-size="9" fill="#6c757d" text-anchor="middle">Firm Characteristic</text>
  <text x="22" y="105" font-family="sans-serif" font-size="9" fill="#6c757d" text-anchor="middle" transform="rotate(-90,22,105)">CAR</text>
  <!-- Scatter -->
  <circle cx="65" cy="140" r="4" fill="#dc3545" opacity="0.6"/>
  <circle cx="90" cy="130" r="4" fill="#dc3545" opacity="0.6"/>
  <circle cx="115" cy="120" r="4" fill="#dc3545" opacity="0.6"/>
  <circle cx="140" cy="110" r="4" fill="#dc3545" opacity="0.6"/>
  <circle cx="165" cy="105" r="4" fill="#dc3545" opacity="0.6"/>
  <circle cx="190" cy="92" r="4" fill="#dc3545" opacity="0.6"/>
  <circle cx="215" cy="85" r="4" fill="#dc3545" opacity="0.6"/>
  <circle cx="240" cy="78" r="4" fill="#dc3545" opacity="0.6"/>
  <circle cx="265" cy="70" r="4" fill="#dc3545" opacity="0.6"/>
  <circle cx="290" cy="63" r="4" fill="#dc3545" opacity="0.6"/>
  <!-- Regression line -->
  <line x1="55" y1="148" x2="305" y2="58" stroke="#dc3545" stroke-width="2.5"/>
  <!-- R-squared label -->
  <text x="255" y="55" font-family="sans-serif" font-size="9" fill="#dc3545">R²</text>
