on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: macos-latest,  r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'

      - name: Assert tarball under 1 MB
        if: runner.os == 'Linux'
        run: |
          R CMD build . --no-build-vignettes --no-manual
          tarball=$(ls -1 *.tar.gz | head -n1)
          tar_size=$(stat -c%s "$tarball")
          if [ "$tar_size" -ge 1048576 ]; then
            echo "Tarball exceeds 1 MB: $tar_size bytes ($tarball)"
            exit 1
          fi
          echo "Tarball OK: $tar_size bytes ($tarball)"

      - name: Assert no new non-ASCII in R/, man/figures/, inst/
        if: runner.os == 'Linux'
        run: |
          # Guard against stray/injected non-ASCII (credential strings, homoglyphs)
          # in the sources that ship in the tarball. The package declares
          # Encoding: UTF-8, so the deliberate non-ASCII already present in
          # roxygen docs (author names, math symbols) and SVG glyphs is legitimate
          # and recorded in .github/non-ascii-baseline.txt. This step fails only
          # when a NEW non-ASCII line appears outside that baseline.
          grep -rnP '[^\x00-\x7F]' R/ man/figures/ inst/ 2>/dev/null | sort > non-ascii-current.txt || true
          if ! diff -u .github/non-ascii-baseline.txt non-ascii-current.txt; then
            echo "New non-ASCII characters found in R/, man/figures/, or inst/."
            echo "If intentional (and covered by Encoding: UTF-8), update .github/non-ascii-baseline.txt."
            exit 1
          fi
          echo "No new non-ASCII characters in R/, man/figures/, inst/"

  coverage:
    runs-on: ubuntu-latest
    name: Test coverage

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          files: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
