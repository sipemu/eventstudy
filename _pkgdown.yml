url: https://sipemu.github.io/eventstudy/

title: EventStudy

description: >
  Financial event study analysis for R — classical methodology, modern
  estimators, and grounded AI interpretation.

template:
  bootstrap: 5
  math-rendering: katex
  bslib:
    bg: "#ffffff"
    fg: "#0f172a"
    primary: "#2563eb"
    link-color: "#2563eb"
    link-hover-color: "#1d4ed8"
    font-scale: 1.0
    base-font:
      google: "Inter"
    heading-font:
      google: "Plus Jakarta Sans"
    code-font:
      google: "JetBrains Mono"

home:
  sidebar: false

navbar:
  logo:
    image: logo.png
    href: https://sipemu.github.io/eventstudy/
    alt: EventStudy
  structure:
    left: [logo, get-started, reference, articles, methods, gallery, examples]
    right: [search, github]
  components:
    get-started:
      text: "Get Started"
      href: articles/introduction.html
    reference:
      text: "Reference"
      href: reference/index.html
    methods:
      text: "Methods"
      menu:
        - text: "Methods Overview"
          href: articles/smoke-test.html
        - text: "Return Models"
          href: articles/methods-return-models.html
        - text: "Test Statistics"
          href: articles/methods-test-statistics.html
        - text: "Panel / DiD"
          href: articles/methods-panel-did.html
        - text: "Intraday"
          href: articles/methods-intraday.html
        - text: "Synthetic Control"
          href: articles/methods-synthetic-control.html
        - text: "AI Advisor"
          href: articles/methods-ai-advisor.html
        - text: "Diagnostics & Robustness"
          href: articles/methods-diagnostics.html
    gallery:
      text: "Gallery"
      href: articles/gallery.html
    examples:
      text: "Examples"
      menu:
        - text: "Earnings Surprise"
          href: articles/example-earnings.html
        - text: "Regulatory Shock"
          href: articles/example-regulatory.html
        - text: "M&A Announcements"
          href: articles/example-ma.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/sipemu/eventstudy
      aria-label: GitHub

reference:
  - title: "Pipeline & Tasks"
    desc: >
      Core entry points and task containers — the objects and functions a user
      touches first to set up and run an event study.
    contents:
      - EventStudyTask
      - ParameterSet
      - run_event_study
      - prepare_event_study
      - fit_model
      - calculate_statistics

  - title: "Return Models"
    desc: >
      R6 model classes for estimating normal returns and computing abnormal
      returns, plus return-calculation strategy classes.
    contents:
      - MarketModel
      - MarketAdjustedModel
      - ComparisonPeriodMeanAdjustedModel
      - FamaFrench3FactorModel
      - FamaFrench5FactorModel
      - Carhart4FactorModel
      - LinearFactorModel
      - GARCHModel
      - DCCGARCHModel
      - RollingWindowModel
      - BHARModel
      - VolumeModel
      - VolatilityModel
      - SimpleReturn
      - LogReturn

  - title: "Test Statistics"
    desc: >
      Single-event (AR/CAR) and multi-event (AAR/CAAR) test statistic classes
      and their container sets.
    contents:
      - ARTTest
      - CARTTest
      - BHARTTest
      - CSectTTest
      - PatellZTest
      - BMPTest
      - SignTest
      - GeneralizedSignTest
      - RankTest
      - KolariPynnonenTest
      - CalendarTimePortfolioTest
      - SingleEventStatisticsSet
      - MultiEventStatisticsSet
      - StatisticsSetBase

  - title: "Panel, Intraday & Synthetic Control"
    desc: >
      Specialized task types and estimation functions for panel DiD, intraday,
      and synthetic control event study designs.
    contents:
      - PanelEventStudyTask
      - IntradayEventStudyTask
      - SyntheticControlTask
      - estimate_panel_event_study
      - prepare_intraday_event_study
      - nonparametric_intraday_test
      - estimate_synthetic_control
      - sc_placebo_test

  - title: "AI Advisor"
    desc: >
      Grounded AI advisor layer — deterministic diagnostics harvester, LLM
      advise function, knowledge base, and provider abstraction classes.
    contents:
      - es_advise
      - es_diagnostics
      - es_kb
      - recommend_stat
      - flag_robustness
      - provider
      - ProviderBase
      - AnthropicProvider
      - OpenAICompatProvider
      - CustomProvider

  - title: "Diagnostics"
    desc: >
      Model validation, pre-trend testing, and p-value adjustment functions.
    contents:
      - validate_task
      - model_diagnostics
      - pretrend_test
      - adjust_p_values

  - title: "Cross-Sectional & Simulation"
    desc: >
      CAR-level cross-sectional analysis, group comparisons, quantiles,
      bootstrap inference, and Monte Carlo power simulation.
    contents:
      - cross_sectional_regression
      - car_by_group
      - car_quantiles
      - bootstrap_test
      - simulate_event_study

  - title: "Export & Reporting"
    desc: >
      Result extraction, multi-format export, broom-compatible tidying, and
      automated RMarkdown report generation.
    contents:
      - export_results
      - es_report
      - generate_report
      - tidy.EventStudyTask

  - title: "Plotting"
    desc: >
      Interactive Plotly-based visualization functions for event study results,
      stock prices, diagnostics, and specialized designs.
    contents:
      - plot_event_study
      - plot_stocks
      - plot_diagnostics
      - plot_car_distribution
      - plot_panel_event_study
      - plot_synthetic_control

  - title: "Data & Datasets"
    desc: >
      Functions for downloading stock prices, factor data, and risk-free rates,
      plus bundled example datasets.
    contents:
      - download_stock_data
      - download_factor_data
      - download_risk_free_rate
      - has_keyword("datasets")

  - title: internal
    contents:
      - ModelBase
      - ReturnCalculation
      - TestStatisticBase
      - degenerate-input-contract
      - starts_with("print.")

articles:
  - title: "Methods"
    desc: >
      Conceptual explanations of return models, test statistics, and
      advanced designs — with formulas, assumptions, and references.
    contents:
      - articles/smoke-test
      - articles/methods-return-models
      - articles/methods-test-statistics
      - articles/methods-panel-did
      - articles/methods-intraday
      - articles/methods-synthetic-control
      - articles/methods-ai-advisor
      - articles/methods-diagnostics

  - title: "Get Started"
    desc: >
      Package overview with a complete Dieselgate worked example.
    contents:
      - introduction

  - title: "Gallery"
    desc: >
      Browse all vignettes by topic.
    contents:
      - gallery

  - title: "Core Workflow"
    desc: >
      From raw price data to publication-ready results — extraction, diagnostics,
      and robust inference.
    contents:
      - result-extraction
      - diagnostics-validation
      - inference-robustness

  - title: "Return Models"
    desc: >
      Multi-factor, time-varying, GARCH, BHAR, volume, volatility, and custom
      return models.
    contents:
      - factor-models-bhar
      - time-varying-models
      - custom-models
      - volume-volatility-event-study

  - title: "Test Statistics"
    desc: >
      Parametric and non-parametric test statistics, and how to create your own.
    contents:
      - custom-test-statistics

  - title: "Advanced Designs"
    desc: >
      Panel DiD with modern estimators, intraday event windows, and synthetic
      control.
    contents:
      - panel-event-study
      - modern-did-estimators
      - intraday-event-study
      - synthetic-control

  - title: "Cross-Sectional & Simulation"
    desc: >
      CAR-level regression on firm characteristics and Monte Carlo power analysis.
    contents:
      - cross-sectional-analysis
      - simulation-power-analysis

  - title: "AI Advisor"
    desc: >
      Grounded AI advisor — two-layer walkthrough with the bundled Dieselgate
      dataset.
    contents:
      - ai-advisor

  - title: "Data & Reporting"
    desc: >
      Downloading market and factor data, and automated RMarkdown report
      generation.
    contents:
      - data-download
      - automated-reports

  # Note: example-* articles live in vignettes/articles/ (not vignettes/), so
  # the articles/ prefix is required in these slugs. All other groups (Core
  # Workflow, Return Models, etc.) use bare slugs because those Rmds live
  # directly in vignettes/. When adding a future example-*.Rmd, always include
  # the articles/ prefix here or the build will silently fail.
  - title: "Worked Examples"
    desc: >
      Complete end-to-end analyses across distinct financial domains -- from
      raw data through model fit, test statistics, plots, and interpretation.
    contents:
      - articles/example-earnings
      - articles/example-regulatory
      - articles/example-ma
