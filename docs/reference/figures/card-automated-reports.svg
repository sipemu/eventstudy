<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none">
  <rect width="360" height="200" fill="#f8f9fa"/>
  <rect width="360" height="6" fill="#6c757d"/>
  <text x="180" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#6c757d" text-anchor="middle">Automated Reports</text>
  <!-- Document page -->
  <rect x="95" y="48" width="170" height="135" rx="4" fill="#fff" stroke="#6c757d" stroke-width="1.5"/>
  <!-- Page fold corner -->
  <polygon points="235,48 265,48 265,72" fill="#dee2e6"/>
  <polygon points="235,48 235,72 265,72" fill="#e9ecef" stroke="#6c757d" stroke-width="1"/>
  <!-- Heading line -->
  <rect x="110" y="62" width="110" height="8" rx="2" fill="#6c757d" opacity="0.7"/>
  <!-- Mini chart in report -->
  <rect x="110" y="80" width="130" height="50" rx="2" fill="#f8f9fa" stroke="#dee2e6"/>
  <polyline points="120,120 135,108 150,100 165,105 180,90 195,82 210,88 225,78 230,75" stroke="#6c757d" stroke-width="2" fill="none"/>
  <!-- Text lines -->
  <rect x="110" y="140" width="130" height="5" rx="1" fill="#dee2e6"/>
  <rect x="110" y="150" width="105" height="5" rx="1" fill="#dee2e6"/>
  <rect x="110" y="160" width="120" height="5" rx="1" fill="#dee2e6"/>
  <rect x="110" y="170" width="90" height="5" rx="1" fill="#dee2e6"/>
</svg>
