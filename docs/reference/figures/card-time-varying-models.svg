<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none">
  <rect width="360" height="200" fill="#f8f9fa"/>
  <rect width="360" height="6" fill="#198754"/>
  <text x="180" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#198754" text-anchor="middle">Time-Varying Models</text>
  <line x1="30" y1="155" x2="330" y2="155" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="30" y1="55" x2="30" y2="155" stroke="#adb5bd" stroke-width="1.5"/>
  <!-- Constant beta reference -->
  <line x1="30" y1="105" x2="330" y2="105" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="335" y="108" font-family="sans-serif" font-size="8" fill="#adb5bd">β̄</text>
  <!-- Rolling beta curve -->
  <path d="M30,120 Q60,115 90,100 Q120,85 150,95 Q180,108 210,80 Q240,58 270,75 Q300,90 330,70" stroke="#198754" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <!-- Confidence band -->
  <path d="M30,130 Q60,125 90,110 Q120,95 150,105 Q180,118 210,90 Q240,68 270,85 Q300,100 330,80" stroke="#198754" stroke-width="1" fill="none" stroke-dasharray="3,2" opacity="0.5"/>
  <path d="M30,110 Q60,105 90,90 Q120,75 150,85 Q180,98 210,70 Q240,48 270,65 Q300,80 330,60" stroke="#198754" stroke-width="1" fill="none" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="30" y="50" font-family="sans-serif" font-size="9" fill="#198754">β(t)</text>
</svg>
