<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none">
  <rect width="360" height="200" fill="#f8f9fa"/>
  <rect width="360" height="6" fill="#6f42c1"/>
  <text x="180" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#6f42c1" text-anchor="middle">Modern DiD Estimators</text>
  <line x1="30" y1="115" x2="330" y2="115" stroke="#dee2e6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="335" y="118" font-family="sans-serif" font-size="8" fill="#adb5bd">0</text>
  <line x1="30" y1="155" x2="330" y2="155" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="30" y1="50" x2="30" y2="155" stroke="#adb5bd" stroke-width="1.5"/>
  <!-- Pre-treatment (flat near 0) -->
  <circle cx="60" cy="117" r="4" fill="#6f42c1" opacity="0.5"/>
  <circle cx="95" cy="113" r="4" fill="#6f42c1" opacity="0.5"/>
  <circle cx="130" cy="116" r="4" fill="#6f42c1" opacity="0.5"/>
  <!-- Event date -->
  <line x1="165" y1="50" x2="165" y2="155" stroke="#6f42c1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="165" y="47" font-family="sans-serif" font-size="9" fill="#6f42c1" text-anchor="middle">t=0</text>
  <!-- Post-treatment (rising effect) -->
  <circle cx="165" cy="108" r="4" fill="#6f42c1"/>
  <circle cx="200" cy="93" r="4" fill="#6f42c1"/>
  <circle cx="235" cy="78" r="4" fill="#6f42c1"/>
  <circle cx="270" cy="70" r="4" fill="#6f42c1"/>
  <circle cx="305" cy="65" r="4" fill="#6f42c1"/>
  <!-- CI lines -->
  <line x1="165" y1="98" x2="165" y2="118" stroke="#6f42c1" stroke-width="1.5"/>
  <line x1="200" y1="83" x2="200" y2="103" stroke="#6f42c1" stroke-width="1.5"/>
  <line x1="235" y1="68" x2="235" y2="88" stroke="#6f42c1" stroke-width="1.5"/>
  <line x1="270" y1="60" x2="270" y2="80" stroke="#6f42c1" stroke-width="1.5"/>
  <line x1="305" y1="55" x2="305" y2="75" stroke="#6f42c1" stroke-width="1.5"/>
</svg>
